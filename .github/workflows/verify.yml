name: Verify local source-policy analyzer
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}/Build/源码
    env:
      TMPDIR: ${{ github.workspace }}/Build/临时
      TMP: ${{ github.workspace }}/Build/临时
      TEMP: ${{ github.workspace }}/Build/临时
      PYTHONPYCACHEPREFIX: ${{ github.workspace }}/Build/缓存/python
      PIP_CACHE_DIR: ${{ github.workspace }}/Build/缓存/pip
      npm_config_cache: ${{ github.workspace }}/Build/缓存/npm
      RUFF_CACHE_DIR: ${{ github.workspace }}/Build/缓存/ruff
      GOCACHE: ${{ github.workspace }}/Build/缓存/go
      GOMODCACHE: ${{ github.workspace }}/Build/缓存/go-mod
      GOTMPDIR: ${{ github.workspace }}/Build/临时
      GOPATH: ${{ github.workspace }}/Build/缓存/go-path
      GOBIN: ${{ github.workspace }}/Build/输出/go-bin
      CARGO_HOME: ${{ github.workspace }}/Build/缓存/cargo
      XDG_CACHE_HOME: ${{ github.workspace }}/Build/缓存/xdg
      CCACHE_DIR: ${{ github.workspace }}/Build/缓存/ccache
      SCCACHE_DIR: ${{ github.workspace }}/Build/缓存/sccache
      NODE_COMPILE_CACHE: ${{ github.workspace }}/Build/缓存/node
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Stage source and restored project inputs under Build
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} 构建.py --stage --ci
        working-directory: ${{ github.workspace }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.2'
          cache: false
      - name: Fetch only this analyzer's pinned build dependency
        run: |
          GOTOOLCHAIN=local GOWORK=off go mod download
          go mod verify
      - name: Test and vet without module network access
        run: |
          make test vet build
          test -z "$(gofmt -l *.go cmd/gocrypto-policy-review/*.go)"
      - name: Install this analyzer and exercise all report statuses
        run: |
          set -eu
          consumer_bin="$(mktemp -d)"
          GOTOOLCHAIN=local GOPROXY=off GOSUMDB=off GOWORK=off GOFLAGS=-mod=readonly CGO_ENABLED=0 GOBIN="$consumer_bin" go install -trimpath -buildvcs=false -ldflags=-buildid= ./cmd/gocrypto-policy-review
          "$consumer_bin/gocrypto-policy-review" -- examples/declared-pass.go.txt > "$TMPDIR/policy-pass.json"
          status=0
          "$consumer_bin/gocrypto-policy-review" -- examples/policy-fail.go.txt > "$TMPDIR/policy-fail.json" || status=$?
          test "$status" -eq 1
          status=0
          "$consumer_bin/gocrypto-policy-review" -- examples/default-review.go.txt > "$TMPDIR/policy-open.json" || status=$?
          test "$status" -eq 2
